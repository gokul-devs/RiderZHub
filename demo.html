<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>RiderZ Hub</title>

 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
   
   *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.sub-head{
    width: 100%;
    background-color: white;
    padding: 15px 20px;
}



.sub-head ul{
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 40px;
    list-style: none;
    flex-wrap: wrap;
}

.sub-head ul li{
    position: relative;
}

.sub-head a{
    text-decoration: none;
    color: black;
    font-weight: bold;
    padding: 10px;
    display: block;
    transition: 0.3s;
}



.sub-head a:hover{
    background-color: rgb(70, 57, 83);
    color: white;
    border-radius: 5px;
}



.dropdown{
    position: absolute;
    top: 45px;
    left: 0;
    background-color: white;
    min-width: 180px;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
    visibility: hidden;
    display: none;
    flex-direction: column;
    z-index: 100;
}

.click:hover .dropdown{
    display: flex;
    visibility: visible;
    
}



@media(max-width:768px){

    .sub-head ul{
        flex-direction: column;
        gap: 15px;
    }

    .dropdown{
        position: static;
        box-shadow: none;
        margin-top: 10px;
        margin-left: 20px;
    }

    .click:hover .dropdown{
        display: flex;
    }
}

  </style>
</head>

<body>





<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
